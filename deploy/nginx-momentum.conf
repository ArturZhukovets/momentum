# Reference snippet — copy to /etc/nginx/sites-available/momentum on the server,
# symlink into sites-enabled, then: nginx -t && systemctl reload nginx
#
# Certificates come from the existing certbot setup:
#   certbot --nginx -d 89-125-51-9.sslip.io
#
# Telegram only accepts webhooks on ports 443/80/88/8443, so nginx must serve 443.

server {
    listen 443 ssl;
    server_name 89-125-51-9.sslip.io;

    ssl_certificate     /etc/letsencrypt/live/89-125-51-9.sslip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/89-125-51-9.sslip.io/privkey.pem;

    location /tg/ {                       # must match the WEBHOOK_PATH prefix
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # aiogram verifies WEBHOOK_SECRET from this header — it must survive the proxy.
        proxy_set_header X-Telegram-Bot-Api-Secret-Token $http_x_telegram_bot_api_secret_token;
    }
}
