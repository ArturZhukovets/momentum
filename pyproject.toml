[project]
name = "momentum"
version = "0.1.0"
description = "Momentum — personal Telegram workout-tracking bot"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aiogram>=3.15",
    "aiosqlite>=0.20",
    "apscheduler>=3.10",
    "python-dotenv>=1.0",
    "pydantic-settings>=2.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/momentum"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[dependency-groups]
dev = ["ruff>=0.7"]
